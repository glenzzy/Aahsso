<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<meta name="description" content="See the menu and order from your table.">
<meta name="theme-color" content="#0d5c63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body{background:var(--bg);margin:0;font-size:14px}
  .mw{max-width:720px;margin:0 auto;padding:12px 12px calc(110px + env(safe-area-inset-bottom,0px))}
  .mh{display:flex;gap:12px;align-items:center;padding:4px 0 10px}
  .mlogo{width:46px;height:46px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:17px;overflow:hidden;flex:none}
  .mlogo img{width:100%;height:100%;object-fit:cover}
  .mh h1{font-size:18px;margin:0} .mh .sub{font-size:12.5px;color:var(--ink3)}
  .mtable{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
  .mhh{background:var(--okSoft);color:var(--ok);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px;font-weight:500}
  .mcats{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 -12px;padding-left:12px;padding-right:12px}
  .mi{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
  .mi.off{opacity:.5} .mi img,.mi .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--line2);display:grid;place-items:center;font-weight:600;color:var(--ink3)}
  .mi .n{font-weight:600;font-size:14.5px} .mi .d{font-size:12px;color:var(--ink3);margin-top:2px} .mi .p{font-weight:650;margin-top:4px} .mi .p s{color:var(--ink3);font-weight:400;margin-right:4px}
  .mcat{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:14px 2px 6px}
  .qy{display:flex;align-items:center;gap:6px} .qy button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;font-weight:600} .qy b{min-width:18px;text-align:center}
  .add{border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:10px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
  .bar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;max-width:700px;margin:0 auto;display:flex;gap:8px}
  .bar:empty{display:none}
  .bar .btn{flex:1;min-height:50px;border-radius:14px;font-size:15px}
  .scr{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .pane{background:var(--bg);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
  .pane h2{font-size:17px;margin:0 0 10px} .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
  .st{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line2)}
  .st.new{background:var(--accentSoft);color:#8a5a12} .st.accepted{background:var(--infoSoft);color:var(--info)} .st.ready{background:var(--okSoft);color:var(--ok)} .st.served{background:var(--brandSoft);color:var(--brand)} .st.rejected{background:var(--badSoft);color:var(--bad)}
  .mine{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
  .calls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
  .err{color:var(--bad);font-size:13px;margin-top:6px}
  button.mtable{border:0;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .mpick{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:12px 14px;margin-bottom:10px;font:inherit;cursor:pointer}
  .mpick b{font-size:15px} .mpick span{font-size:12.5px;opacity:.9}
  .tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:6px}
  .tpick button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
  .tpick button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  select.inp{width:100%}
  .foot{text-align:center;color:var(--ink3);font-size:11.5px;margin-top:20px}
</style>
</head>
<body>
<div class="mw" id="app"><div class="empty">Loading the menu…</div></div>
<script src="/menu.js"></script>
</body>
</html>
