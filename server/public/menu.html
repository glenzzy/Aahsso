<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<meta name="description" content="See the menu and order from your table.">
<meta name="theme-color" content="#0d5c63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  /* the customer menu — every class starts with m- so the app stylesheet never reaches in */
  html,body{background:var(--bg);margin:0}
  body{font-size:14px;overflow-x:hidden}
  .m-load{padding:60px 16px;text-align:center;color:var(--ink3)}
  /* top bar */
  .m-top{position:sticky;top:0;z-index:15;background:var(--card);border-bottom:1px solid var(--line)}
  .m-top-in{display:flex;align-items:center;gap:12px;padding:10px 16px}
  .m-logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px;overflow:hidden;flex:none}
  .m-logo img{width:100%;height:100%;object-fit:cover}
  .m-name{flex:1;min-width:0}
  .m-name h1{font-size:17px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-name div{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-tbl{flex:none;display:inline-flex;align-items:center;gap:4px;background:var(--brand);color:#fff;border:0;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600}
  button.m-tbl{cursor:pointer}
  /* layout: one column on phones; categories · dishes · your order on wide screens */
  .m-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .m-side,.m-cart{display:none}
  .m-chips{position:sticky;top:63px;z-index:10;background:var(--bg);margin:0 -16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .m-chips::-webkit-scrollbar{display:none}
  .m-chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
  .m-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  @media (min-width:1000px){
    .m-top-in{padding:12px 24px}
    .m-wrap{grid-template-columns:190px minmax(0,1fr) 340px;gap:24px;padding:20px 24px 40px}
    .m-side{display:flex;flex-direction:column;gap:2px;position:sticky;top:88px;align-self:start}
    .m-side .m-chip{border:0;background:none;border-radius:10px;text-align:left;padding:9px 12px;font-size:14px}
    .m-side .m-chip.on{background:var(--brandSoft);color:var(--brand);font-weight:600}
    .m-cart{display:block;position:sticky;top:88px;align-self:start;max-height:calc(100vh - 108px);overflow:auto}
    .m-chips,.m-bar,.m-main .m-mine-box{display:none!important}
  }
  .m-side-h{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:0 12px 6px}
  /* banners */
  .m-pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:14px 16px;margin-bottom:12px;font:inherit;cursor:pointer}
  .m-pick b{display:block;font-size:15px} .m-pick span{display:block;font-size:12.5px;opacity:.9;margin-top:2px} .m-pick i{font-style:normal;font-size:20px;margin-left:auto}
  .m-hh{background:var(--okSoft);color:var(--ok);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;font-weight:500}
  .m-note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink2);margin-bottom:12px}
  /* dishes */
  .m-sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:18px 0 8px}
  .m-sec:first-child{margin-top:4px}
  .m-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  @media (min-width:640px){.m-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
  @media (min-width:1000px) and (max-width:1199px){.m-grid{grid-template-columns:minmax(0,1fr)}}
  @media (min-width:1400px){.m-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .m-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
  .m-item.off{opacity:.5}
  .m-item.in{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
  .m-ph{width:68px;height:68px;border-radius:10px;object-fit:cover;flex:none;background:var(--line2);display:grid;place-items:center;font-weight:600;color:var(--ink3)}
  .m-info{flex:1;min-width:0}
  .m-n{font-weight:600;font-size:14.5px;line-height:1.25}
  .m-d{font-size:12px;color:var(--ink3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .m-p{font-weight:600;margin-top:5px;font-size:14px} .m-p s{color:var(--ink3);font-weight:400;margin-right:5px;font-size:12.5px} .m-p em{font-style:normal;color:var(--bad);font-weight:500;font-size:12.5px}
  .m-add{flex:none;border:1px solid var(--brand);color:var(--brand);background:var(--card);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  .m-qty{flex:none;display:flex;align-items:center;gap:4px}
  .m-qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:18px;line-height:1;cursor:pointer;color:var(--ink)}
  .m-qty button.plus{background:var(--brand);border-color:var(--brand);color:#fff}
  .m-qty b{min-width:22px;text-align:center;font-weight:600}
  .m-empty{padding:40px 16px;text-align:center;color:var(--ink3)}
  .m-foot{text-align:center;color:var(--ink3);font-size:11.5px;margin-top:28px}
  /* your orders + your basket (card on wide screens, sheet on phones) */
  .m-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .m-card h2{font-size:15px;margin:0 0 8px}
  .m-ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2)}
  .m-ln:last-child{border-bottom:0}
  .m-ln .grow{min-width:0}
  .m-sum{display:flex;justify-content:space-between;font-weight:600;font-size:15px;padding:10px 0 4px}
  .m-st{flex:none;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line2);color:var(--ink2)}
  .m-st.new{background:var(--accentSoft);color:#8a5a12} .m-st.accepted{background:var(--infoSoft);color:var(--info)} .m-st.ready{background:var(--okSoft);color:var(--ok)} .m-st.served{background:var(--brandSoft);color:var(--brand)} .m-st.rejected{background:var(--badSoft);color:var(--bad)}
  .m-calls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .m-calls button{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .m-calls button:disabled{opacity:.5}
  .m-calls button{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .1s}
  .m-calls button.ringing{transform:scale(.97);border-color:var(--brand);animation:m-ring .5s ease-in-out infinite}
  @keyframes m-ring{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--brand) 10%,transparent)}}
  @media (prefers-reduced-motion:reduce){.m-calls button.ringing{animation:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}}
  .m-calls-hint{font-size:12px;color:var(--ink3);text-align:center;margin:-4px 0 12px}
  .m-f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);margin-top:10px}
  .m-f input,.m-f select{width:100%;box-sizing:border-box;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:15px;background:var(--card);color:var(--ink)}
  .m-err{color:var(--bad);font-size:13px;margin-top:6px}
  .m-send{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .m-send:disabled{opacity:.6}
  .m-back{width:100%;min-height:44px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font:inherit;cursor:pointer;color:var(--ink)}
  .m-hint{font-size:12px;color:var(--ink3);margin-top:8px;text-align:center}
  .m-muted{color:var(--ink3);font-size:12.5px}
  .m-cart-empty{color:var(--ink3);font-size:13px;padding:6px 0 2px}
  /* phone: the basket bar and the sheets */
  .m-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
  .m-bar button{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:14px;background:var(--brand);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:0 18px;cursor:pointer;box-shadow:0 6px 20px rgba(13,92,99,.3)}
  .m-bar .c{background:rgba(255,255,255,.2);border-radius:99px;padding:2px 9px;font-size:13px}
  .m-scr{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .m-pane{background:var(--bg);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;box-sizing:border-box;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
  @media (min-width:640px){.m-scr{align-items:center}.m-pane{border-radius:18px}}
  .m-pane h2{font-size:17px;margin:0 0 4px}
  .m-tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-bottom:6px}
  .m-tpick button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:16px;font-weight:600;cursor:pointer;color:var(--ink)}
  .m-tpick button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .m-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  @media (min-width:1000px){.m-toast{bottom:24px}}

/* delivery & pickup */
.m-modes{display:flex;gap:8px;margin:0 0 12px;background:var(--card,#fff);border:1px solid var(--line,#e5e2da);border-radius:14px;padding:5px}
.m-modes button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;border-radius:10px;padding:10px 6px;font:inherit;font-weight:600;font-size:14px;color:inherit;cursor:pointer}
.m-modes button.on{background:var(--brand,#0f5f66);color:#fff}
.m-away{margin-bottom:12px}
.m-sub{font-weight:500;font-size:14px;opacity:.85;padding-top:4px}
.m-seg{display:flex;gap:6px;margin-top:4px}.m-seg button{flex:1;border:1px solid var(--line,#e5e2da);background:#fff;border-radius:10px;padding:9px;font:inherit;cursor:pointer}.m-seg button.on{border-color:var(--brand,#0f5f66);background:var(--brand,#0f5f66);color:#fff}
.m-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-pays{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.m-pay{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line,#e5e2da);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}
.m-pay.on{border-color:var(--brand,#0f5f66);box-shadow:0 0 0 2px rgba(15,95,102,.15)}
.m-pay input{width:18px!important;height:18px!important;min-height:0!important;flex:none;margin:2px 0 0!important;padding:0!important;border:0!important;box-shadow:none!important;accent-color:var(--brand,#0f5f66)}.m-pay span{display:flex;flex-direction:column}.m-pay span span{font-size:12.5px;opacity:.7}
.m-momo{background:#fff8ee;border:1px solid #f3c98b;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:6px 0}
.m-momo input{display:block;width:100%;box-sizing:border-box;margin-top:8px;border:1px solid var(--line,#e5e2da);border-radius:10px;padding:10px;font:inherit}
.m-st.prep{background:#e9f0fb;color:#1f5fa8}
</style>
</head>
<body>
<div id="app"><div class="m-load">Loading the menu…</div></div>
<script src="/menu.js"></script>
</body>
</html>
