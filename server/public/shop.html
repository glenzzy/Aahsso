<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop</title>
<meta name="description" content="Browse items in stock and send your order with your delivery details.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body{background:var(--bg);margin:0}
  .shop{max-width:1180px;margin:0 auto;padding:16px 16px 120px}
  .shop-head{display:flex;gap:14px;align-items:center;padding:6px 0 16px}
  .shop-logo{width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden;flex:none}
  .shop-logo img{width:100%;height:100%;object-fit:cover}
  .shop-head h1{font-size:21px;margin:0}
  .shop-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
  .pcard{background:var(--card,#fff);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .pcard .pim{aspect-ratio:1/1;background:var(--line2);display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--ink3)}
  .pcard .pim img{width:100%;height:100%;object-fit:cover}
  .pcard .pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .pcard .pn{font-weight:700;font-size:14px;line-height:1.3}
  .pcard .pp{font-weight:800;font-size:16px}
  .pcard .pm{display:flex;gap:6px;flex-wrap:wrap}
  .pcard .pa{margin-top:auto}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;cursor:pointer}
  .qty input{width:52px;text-align:center;min-height:38px;padding:6px}
  .basketbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(20,32,46,.35);z-index:20}
  .basketbar .grow{min-width:0}
  .panel{position:fixed;inset:0;background:rgba(20,32,46,.45);display:flex;justify-content:center;align-items:flex-end;z-index:30}
  .panel .sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px}
  @media (min-width:760px){.panel{align-items:center}.panel .sheet{border-radius:20px}}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mode{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit}
  .mode.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
  .mode b{display:block;font-size:14px}
  .mode span{font-size:12px;color:var(--ink3)}
  .bl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
  .err{color:var(--bad);font-weight:600;font-size:14px;min-height:1px}
  .done{text-align:center;padding:30px 10px}
  .done .big{font-size:44px}
  .hide{display:none!important}
  /* phones: two products per row, form fields stacked */
  @media (max-width:520px){.panel .grid2{grid-template-columns:1fr}.pcard .pb{padding:9px 10px 10px}.pcard .pn{font-size:13px}.pcard .pp{font-size:15px}.qty button{width:34px;height:34px}.qty input{width:44px;min-height:34px}.bl{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="shop" id="app" aria-live="polite"><div class="empty" style="padding:60px 0">Loading the shop…</div></main>
<script src="/shop.js"></script>
</body>
</html>
